{% set version = "1.5.0" %}

# on our builders there is no X11 installed and therefore import
# test will fail
{% if target_platform != "linux-aarch64" and target_platform != "linux-64"%}
{% set enable_testingui = true %}
{% else %}
{% set enable_testingui = false %}
{% endif %}

package:
  name: glue-core
  version: {{ version }}

source:

  fn: glue-core-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/g/glue-core/glue-core-{{ version }}.tar.gz
  sha256: 1a0ec533523a51d3514a045a24ea75248281ef2b27b02adcac5ed983f552da7a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  entry_points:
    - glue = glue.main:main
    - glue-config = glue.config_gen:main
    - glue-deps = glue._deps:main
  osx_is_app: True
  skip: True  # [py<37]
  # there is no qt support on s390x, nor ppc64le
  skip: True  # [linux and (ppc64le or s390x)]

requirements:
  host:
    - python
    - pip
    - setuptools >=30.3
    - setuptools_scm
    - wheel

  run:
    # The following is needed to make sure that the package works as a GUI
    # application (glue needs to be run with python.app, not python)
    - python.app  # [osx]

    # Required dependencies
    - astropy >=4.0
    - bottleneck >=1.3
    - dill >=0.2
    - echo >=0.5
    - h5py >=2.10
    - ipykernel >=4.0,!=5.0.0,!=5.1.0
    - ipython >=4.0
    - matplotlib-base >=3.2
    - mpl-scatter-density >=0.7
    - numpy >=1.17
    - pandas >=1.2
    - pyqt
    - python
    - qtconsole >=4.3
    - qtpy >=1.9
    - scipy >=1.1
    - setuptools >=30.3
    - xlrd >=1.2

    # Optional dependencies (defined in ``extras_require``)
    - scikit-image

    # Temporary: the scikit-image conda package is missing the dask dependency
    # so we add it here for now
    - dask

{% if enable_testingui %}
test:
  imports:
    - glue
    - glue.core
    - glue.app.qt
  commands:
    - glue --version
    - glue-deps list
{% endif %}

# NOTE: we deliberatey do NOT include an app entry here, because we instead do this
# in the glueviz meta-package (we don't want glue to appear twice in the navigator)

about:
  home: http://glueviz.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Multi-dimensional linked data exploration

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
    - izahn
