{% set name = "glue-core" %}
{% set version = "1.28.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 061210be79c33045119569758e611b48798a4161518bf190f761987f0acaee0a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - glue-config = glue.config_gen:main
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools >=61.2
    - wheel
    - setuptools-scm
  run:
    - python
    - numpy >=1.17
    - matplotlib-base >=3.2
    - scipy >=1.1
    - pandas >=1.2
    - astropy >=4.0
    - echo >=0.12
    - fast-histogram >=0.12
    - ipython >=4.0
    - dill >=0.2
    - h5py >=2.10
    - xlrd >=1.2
    - openpyxl >=3.0
    - mpl-scatter-density >=0.8
    - shapely >=2.0
    # recommended
    - scikit-image
  run_constrained:
    # See https://github.com/python-pillow/Pillow/issues/4509
    # for why we exclude pillow 7.1.0
    - pillow !=7.1.0

# py3.10: astropy 6.1.x + matplotlib>=3.10 breaks WCSAxes, viewer tests fail on 'Axes' object has no attribute 'coords'
{% set py310_deselect = "--deselect viewers/image/tests/test_viewer.py" %}
{% set py310_deselect = py310_deselect + " --deselect viewers/image/tests/test_python_export.py" %}
{% set py310_deselect = py310_deselect + " --deselect viewers/image/tests/test_pixel_selection_mode.py" %}
{% set py310_deselect = py310_deselect + " --deselect viewers/matplotlib/tests/test_line_layers.py" %}
{% set py310_deselect = py310_deselect + " --deselect plugins/tools/path_slicer/tests/test_matplotlib_mode.py" %}
{% set py310_deselect = py310_deselect + " --deselect plugins/tools/path_slicer/tests/test_common.py" %}
